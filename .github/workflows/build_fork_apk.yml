name: Build APK (fork)

# Builds an installable, debug-signed "preview" APK without needing the
# upstream project's signing or Google secrets. Runs on every push to the
# explain-button branch, or manually from the Actions tab.
on:
  push:
    branches:
      - explain-button
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build preview APK
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # The native dictionary engine (hoshidicts) is a public submodule.
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build app
        run: ./gradlew assemblePreview

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chimahon-explain-preview-${{ github.run_number }}
          path: app/build/outputs/apk/preview/*universal*.apk
          if-no-files-found: error
