name: Build APK (fork)

# Builds an installable "preview" APK without needing the upstream project's
# signing or Google secrets. Runs on every push to the explain-button branch,
# or manually from the Actions tab.
#
# Every build is signed with the same key so new builds install over old ones
# and keep their data. The key lives in .github/signing/chimahon-fork.jks,
# encrypted with a password kept in the FORK_SIGNING_PASSWORD repository secret.
on:
  push:
    branches:
      - explain-button
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build preview APK
    runs-on: 'ubuntu-24.04'

    env:
      SIGNING_PASSWORD: ${{ secrets.FORK_SIGNING_PASSWORD }}
      # SHA-256 of the signing certificate, so a build signed with any other
      # key fails instead of producing an APK that won't install over the last one.
      EXPECTED_CERT_SHA256: 0299355aa91d48fcd0d780627c630c16fd25f1d20241c1f3a11a98ab238ffc22

    steps:
      - name: Check signing secret
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error title=Missing signing password::Add the FORK_SIGNING_PASSWORD secret under Settings > Secrets and variables > Actions, then re-run this build."
            exit 1
          fi

      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # The native dictionary engine (hoshidicts) is a public submodule.
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      # The password never contains whitespace, so any spaces or line breaks
      # picked up when pasting the secret are stripped before use.
      - name: Check signing password opens the key
        run: |
          pw="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')"
          echo "::add-mask::$pw"
          if [ "$pw" != "$SIGNING_PASSWORD" ]; then
            echo "::warning title=Signing secret had extra whitespace::Stripped spaces or line breaks from FORK_SIGNING_PASSWORD."
          fi
          if ! keytool -list -storetype PKCS12 -keystore .github/signing/chimahon-fork.jks \
               -storepass "$pw" -alias chimahon-fork > /dev/null 2> keytool.err; then
            echo "::error title=Signing password doesn't open the key::FORK_SIGNING_PASSWORD (${#pw} characters after trimming, expected 32) was rejected: $(tr '\n' ' ' < keytool.err)"
            exit 1
          fi

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build app
        # android.injected.signing.* replaces the throwaway debug key with the
        # fork's fixed key for this build only. On failure, the error is copied
        # into an annotation so it shows on the run's summary page.
        run: |
          set -o pipefail
          pw="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')"
          if ! ./gradlew assemblePreview \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/.github/signing/chimahon-fork.jks" \
              -Pandroid.injected.signing.store.password="$pw" \
              -Pandroid.injected.signing.key.alias=chimahon-fork \
              -Pandroid.injected.signing.key.password="$pw" 2>&1 | tee gradle.log; then
            details="$( { grep -E '^e: ' gradle.log | head -15; sed -n '/What went wrong:/,/\* Try:/p' gradle.log | head -40; } \
              | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Gradle build failed::${details:-No error summary found in the Gradle output.}"
            exit 1
          fi

      - name: Verify signing certificate
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk="$(ls app/build/outputs/apk/preview/*universal*.apk)"
          actual="$("$build_tools/apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          echo "Signed with certificate SHA-256: $actual"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=Wrong signing key::APK was signed with $actual, expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          echo "::notice title=Signed with the fork's fixed key::$actual"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chimahon-explain-preview-${{ github.run_number }}
          path: app/build/outputs/apk/preview/*universal*.apk
          if-no-files-found: error
